function aboutPage(){return title('О проекте','AWEN Music — музыкальная библиотека сообщества AWEN')+`<div class="about"><h2>Что уже работает</h2><p>Главная страница, 19 музыкальных направлений, список поджанров, поиск, фильтры, пять подборок, избранное, экспорт и импорт JSON. Демо-плеер воспроизводит оригинальный тестовый звук, созданный кодом в браузере.</p><h2>Что ещё не подключено</h2><p>Импорт из VK API и коммерческая музыка. Для прослушивания настоящих записей необходимо добавить разрешённый прямой адрес аудиофайла в поле <code>audio_url</code>. Само наличие песни в ВКонтакте не даёт права публиковать копию на другом сайте.</p><h2>Загрузить каталог</h2><p>Можно импортировать файл JSON формата <code>{"tracks":[{"title":"Название","artist":"Исполнитель","genre":"Phonk","subgenres":["Chill Phonk"]}]}</code>. Импорт сохраняется только в браузере этого устройства через IndexedDB; на GitHub Pages он не появляется у других посетителей.</p><div class="actions"><button class="btn primary" data-action="import">Импорт JSON</button><button class="btn" data-action="example">Скачать пример JSON</button><button class="btn" data-action="export">Экспорт каталога</button><button class="btn" data-action="reset">Вернуть демо</button></div><h2>Исходное сообщество</h2><p><a href="https://vk.ru/awenqc" target="_blank" rel="noopener noreferrer">vk.ru/awenqc</a></p></div>`;}
function render(){let page=st.view==='home'?home():['tracks','favorites','unavailable'].includes(st.view)?tracksPage():st.view==='genres'?genresPage():st.view==='playlists'?playlistsPage():st.view==='artists'?artistsPage():st.view==='albums'?albumsPage():aboutPage();$('#app').innerHTML=page;$('#desktopNav').innerHTML=navHTML();$('#mobileNav').innerHTML=navHTML();$('#search').value=st.q;}
function openDetails(id){let t=byId(id);if(!t)return;let fields=[['Исполнитель',t.artist],['Альбом',t.album],['Жанр',t.genre],['Поджанры',t.subgenres.join(', ')||'—'],['Язык',t.language],['Год',t.year||'—'],['Настроение',t.moods.join(', ')||'—'],['Длительность',timefmt(t.duration)],['Статус',playable(t)?'Аудио доступно':t.source_status==='unavailable'?'Недоступна':'Источник не подключён']];$('#modalContent').innerHTML=`${cover(t.genre,palette(t.genre))}<h2>${esc(t.title)}</h2><p>${esc(t.artist)}</p><dl class="details-grid">${fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl><div class="actions">${playable(t)?`<button class="btn primary" data-play="${esc(t.id)}">▶ Слушать</button>`:'<span class="selection-note">Аудиофайл не подключён — воспроизведение недоступно.</span>'}${t.source_url?`<a class="btn" href="${esc(t.source_url)}" target="_blank" rel="noopener noreferrer">Открыть источник</a>`:''}</div>`;$('#modalBackdrop').classList.add('open');}
function closeDetails(){$('#modalBackdrop').classList.remove('open');}
function demoSound(){if(soundURL)return soundURL;const sr=11025,len=sr*8,raw=new ArrayBuffer(44+len*2),v=new DataView(raw);let i=0;function write(s){for(let c of s)v.setUint8(i++,c.charCodeAt(0));}function n32(a){v.setUint32(i,a,true);i+=4;}function n16(a){v.setUint16(i,a,true);i+=2;}write('RIFF');n32(36+len*2);write('WAVEfmt ');n32(16);n16(1);n16(1);n32(sr);n32(sr*2);n16(2);n16(16);write('data');n32(len*2);let notes=[220,261.63,329.63,392,349.23,293.66,246.94,261.63];for(let x=0;x<len;x++){let t=x/sr,j=Math.floor(t),f=notes[j],env=Math.min(1,t/.12)*Math.min(1,(8-t)/.4),wave=(Math.sin(Math.PI*2*f*t)*.12+Math.sin(Math.PI*f*t)*.10+Math.sin(Math.PI*3*f*t)*.035)*env;v.setInt16(i,Math.max(-32768,Math.min(32767,wave*32767)),true);i+=2;}soundURL=URL.createObjectURL(new Blob([raw],{type:'audio/wav'}));return soundURL;}
function updatePlayer(){if(!current){$('#nowTitle').textContent='Выбери композицию';$('#nowArtist').textContent='AWEN Music';$('#play').disabled=true;return;}$('#play').disabled=false;$('#nowTitle').textContent=current.title;$('#nowArtist').textContent=current.artist;let col=palette(current.genre);$('#playerCover').style.setProperty('--ca',col[0]);$('#playerCover').style.setProperty('--cb',col[1]);$('#play').textContent=audio.paused?'▶':'Ⅱ';$('#duration').textContent=timefmt(Number.isFinite(audio.duration)?audio.duration:current.duration);}
function playTrack(id){let t=byId(id);if(!t)return;if(!playable(t)){openDetails(id);notify('Для этой записи пока нет разрешённого аудиофайла.');return;}let url=t.audio_url==='demo://soundcheck'?demoSound():safeURL(t.audio_url);if(!url){notify('Недопустимый адрес аудиофайла');return;}let change=!current||current.id!==id;current=t;if(change){audio.src=url;audio.load();}queue=filtered().filter(playable).map(x=>x.id);if(!queue.includes(id))queue.unshift(id);qpos=queue.indexOf(id);updatePlayer();closeDetails();audio.play().catch(()=>notify('Браузер не смог воспроизвести аудио. Проверь адрес и формат файла.'));}
function stepTrack(dir){if(!queue.length)return;let next=(qpos+dir+queue.length)%queue.length;playTrack(queue[next]);}
function download(name,content){let url=URL.createObjectURL(new Blob([content],{type:'application/json;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function openDatabase(){return new Promise((ok,no)=>{if(!('indexedDB'in window))return no(Error('Нет IndexedDB'));let req=indexedDB.open('AWEN-CATALOG',1);req.onupgradeneeded=()=>req.result.createObjectStore('data');req.onsuccess=()=>ok(req.result);req.onerror=()=>no(req.error);});}
async function dbRead(){let db=await openDatabase();return new Promise((ok,no)=>{let req=db.transaction('data','readonly').objectStore('data').get('tracks');req.onsuccess=()=>{db.close();ok(req.result);};req.onerror=()=>{db.close();no(req.error);};});}
async function dbWrite(value){let db=await openDatabase();return new Promise((ok,no)=>{let tx=db.transaction('data','readwrite');tx.objectStore('data').put(value,'tracks');tx.oncomplete=()=>{db.close();ok();};tx.onerror=()=>{db.close();no(tx.error);};});}
function parseCatalog(data){let a=Array.isArray(data)?data:(data&&Array.isArray(data.tracks)?data.tracks:null);if(!a)throw Error('Ожидается массив песен или объект {"tracks":[...]}');if(a.length>30000)throw Error('Максимум 30 000 записей за один импорт');let ids=new Set(),out=[];a.forEach((t,i)=>{let x=sanitize(t,i);if(!x||ids.has(x.id))return;ids.add(x.id);out.push(x);});return out;}
async function importJSON(file){if(!file)return;if(file.size>40*1024*1024){notify('Файл больше 40 МБ');return;}try{let obj=JSON.parse(await file.text()),newTracks=parseCatalog(obj);tracks=newTracks;demo=false;try{localStorage.setItem('awen-catalog-mode','local');}catch(_){}resetFilters();st.q='';setView('tracks');notify(`Импортировано ${nfmt(tracks.length)} песен`);try{await dbWrite(tracks);}catch{notify('Каталог импортирован, но не удалось сохранить на устройстве');}}catch(e){notify('Ошибка импорта: '+e.message);}}
function favorite(id){if(fav.has(id))fav.delete(id);else fav.add(id);persistFav();render();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-nav],[data-list],[data-genre],[data-artist],[data-album],[data-detail],[data-play],[data-fav],[data-action]');if(!b)return;let d=b.dataset;if(d.nav){resetFilters();setView(d.nav);return;}if(d.list){resetFilters();st.playlist=d.list;setView('tracks');return;}if(d.genre){resetFilters();st.genre=d.genre;setView('tracks');return;}if(d.artist){resetFilters();st.artist=d.artist;setView('tracks');return;}if(d.album){resetFilters();st.album=d.album;setView('tracks');return;}if(d.detail){openDetails(d.detail);return;}if(d.play){playTrack(d.play);return;}if(d.fav){favorite(d.fav);return;}if(d.action==='close'){closeDetails();return;}if(d.action==='clear'){resetFilters();render();return;}if(d.action==='more'){st.limit+=60;render();return;}if(d.action==='import'){$('#importInput').click();return;}if(d.action==='export'){download('awen-tracks.json',JSON.stringify({tracks},null,2));return;}if(d.action==='example'){download('awen-example.json',JSON.stringify({tracks:[{id:'example-1',title:'Название композиции',artist:'Исполнитель',album:'Без альбома',genre:'Phonk',subgenres:['Chill Phonk'],year:2024,language:'Без слов',moods:['Ночное'],energy:2,duration:220,playlists:['night'],source_status:'unknown',source_url:'',audio_url:''}]},null,2));return;}if(d.action==='reset'){if(!confirm('Заменить текущий локальный каталог демонстрацией?'))return;tracks=seedDemo();demo=true;try{localStorage.setItem('awen-catalog-mode','demo');}catch(_){}resetFilters();st.q='';dbWrite(null).catch(()=>{});setView('home');notify('Демо-каталог восстановлен');}});
document.addEventListener('change',e=>{let k=e.target.dataset.filter;if(k){st[k]=e.target.value;if(k==='genre')st.style='';st.limit=60;render();}});
$('#search').addEventListener('input',e=>{st.q=e.target.value;st.limit=60;if(st.q&&['home','genres','playlists','about'].includes(st.view))st.view='tracks';render();$('#search').focus();});
$('#importInput').addEventListener('change',e=>{importJSON(e.target.files[0]);e.target.value='';});
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeDetails();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetails();});
$('#play').addEventListener('click',()=>{if(!current)return;if(audio.paused)audio.play().catch(()=>notify('Воспроизведение недоступно'));else audio.pause();});$('#prev').addEventListener('click',()=>stepTrack(-1));$('#next').addEventListener('click',()=>stepTrack(1));$('#volume').addEventListener('input',e=>audio.volume=Number(e.target.value)/100);$('#seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration)&&audio.duration>0)audio.currentTime=audio.duration*Number(e.target.value)/100;});audio.addEventListener('timeupdate',()=>{$('#elapsed').textContent=timefmt(audio.currentTime);if(Number.isFinite(audio.duration)&&audio.duration>0){$('#duration').textContent=timefmt(audio.duration);$('#seek').value=String(Math.round(100*audio.currentTime/audio.duration));}});audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('loadedmetadata',updatePlayer);audio.addEventListener('ended',()=>{if(queue.length>1)stepTrack(1);else updatePlayer();});audio.addEventListener('error',()=>notify('Аудиофайл не загрузился — проверь ссылку на источник.'));
render();
</script>
<script src="./awen-services.js" defer></script>
</body>
