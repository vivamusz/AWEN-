name: AWEN - Match official Apple Music catalog
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-match.yml"
      - "scripts/awen_match.py"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: awen-match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Match official metadata (no audio downloads)
        env:
          AWEN_BATCH: "180"
          AWEN_PAUSE: "3.6"
        run: python3 scripts/awen_match.py
      - name: Save progress and matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awen-catalog.json awen-match-status.json awen-match-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AWEN Apple Music metadata matches"
            git push
          else
            echo "No changes to publish"
          fi
