name: AWEN - Match official Apple Music catalog
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-match.yml"
      - "scripts/awen_match.py"
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: awen-match
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Match official metadata (no audio downloads)
        env:
          AWEN_BATCH: "240"
          AWEN_PAUSE: "3.6"
        run: python3 scripts/awen_match.py
      - name: Save progress and matches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awen-catalog.json awen-match-status.json awen-match-review.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Update AWEN Apple Music metadata matches"
          # Another workflow or chat may have updated unrelated files while matching.
          # Rebase this finished batch onto the latest main before trying again.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Apple Music matches and progress published"
              exit 0
            fi
            echo "Remote changed; retrying with latest main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase conflict: refusing to overwrite other catalog edits"
              exit 1
            }
            sleep 2
          done
          exit 1
