name: AWEN catalog integrity check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-catalog-check.yml"
      - "scripts/awen_match.py"
      - "scripts/awen_apple_backfill.py"
      - "scripts/merge_apple_metadata_overlay.py"
      - "awen-apple-metadata.json"
      - "scripts/awen_musicbrainz.py"
      - "scripts/apply_curator_patches.py"
      - "scripts/merge_apple_state.py"
      - "scripts/merge_musicbrainz_state.py"
      - "scripts/refresh_review_queue.py"
      - "scripts/test_data_pipeline.py"
      - "awen-curation.json"
      - "awen-review-queue.json"
      - "curator.html"
      - "awen-services.js"
      - "index.html"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Python syntax
        run: python3 -m py_compile scripts/awen_match.py scripts/awen_apple_backfill.py scripts/merge_apple_metadata_overlay.py scripts/awen_musicbrainz.py scripts/merge_apple_state.py scripts/merge_musicbrainz_state.py scripts/refresh_review_queue.py scripts/apply_curator_patches.py
      - name: Check JS and embedded page scripts
        run: |
          node --check awen-services.js
          node --check awen-open-music.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          for file in ("curator.html", "index.html"):
              source=Path(file).read_text(encoding="utf-8")
              scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',source)
              assert scripts, f"No embedded JS in {file}"
              for idx,script in enumerate(scripts):
                  Path(f"/tmp/awen-{file}-{idx}.js").write_text(script,encoding="utf-8")
          PY
          for f in /tmp/awen-*.js; do node --check "$f"; done
      - name: Test enrichment logic and patch merger
        run: python3 scripts/test_data_pipeline.py
      - name: Validate JSON catalog and playlist references
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read(name):
              return json.loads(Path(name).read_text(encoding="utf-8"))
          catalog=read("awen-catalog.json")["tracks"]
          curation=read("awen-curation.json")["tracks"]
          musicbrainz=read("awen-musicbrainz.json")["tracks"]
          apple=read("awen-apple-metadata.json")["tracks"]
          review=read("awen-review-queue.json")
          ids={t["id"] for t in catalog}
          assert len(ids)==len(catalog),"Duplicate IDs in catalog"
          assert set(curation)<=ids,"Curation has IDs not present in catalog"
          assert set(musicbrainz)<=ids,"MusicBrainz has IDs not present in catalog"
          assert set(apple)<=ids,"Apple metadata has IDs not present in catalog"
          assert all(isinstance(v.get("verified_metadata"),dict) for v in apple.values()),"Unverified Apple overlay rows"
          assert set(x["id"] for x in review["items"])<=ids,"Review queue mismatch"
          playlists={"road","night","nightplus","dance","chill"}
          genres={
            "Pop","Hip-Hop / Rap","R&B / Soul","Phonk","Funk / Disco",
            "Chill / Lo-Fi / Ambient","House","Techno / Trance",
            "Bass Music / EDM","Drum & Bass / UK Bass","Latin / Brazilian Club",
            "Afro / Global Club","Synth / Retro Electronic","Rock / Indie",
            "Metal / Punk","Jazz / Blues","Folk / Ethno / World",
            "Classical / Cinematic","Country",
          }
          for ident,patch in curation.items():
              assert set(patch.get("playlists",[]))<=playlists,("Bad playlists",ident)
              if patch.get("genre"):
                  assert patch["genre"] in genres,("Unknown genre",ident,patch["genre"])
          for ident,patch in musicbrainz.items():
              if patch.get("genre"):
                  assert patch["genre"] in genres,("Unknown MusicBrainz genre",ident)
          print("CATALOG OK",len(catalog),"CURATED",len(curation),
                "MUSICBRAINZ",len(musicbrainz),"APPLE",len(apple),"REVIEW",len(review["items"]))
          PY
