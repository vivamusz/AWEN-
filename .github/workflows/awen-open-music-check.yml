name: AWEN open music API check
on:
  workflow_dispatch:
  push:
    paths:
      - "awen-open-music.js"
      - ".github/workflows/awen-open-music-check.yml"

permissions:
  contents: read

jobs:
  audius-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm Audius public search and audio stream
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          import urllib.error

          base = "https://api.audius.co/v1"
          headers = {"User-Agent": "AWEN-Music/1.0"}
          req = urllib.request.Request(base + "/tracks/trending?app_name=AWEN&limit=5&time=week", headers=headers)
          with urllib.request.urlopen(req, timeout=18) as response:
              data = json.load(response)
          tracks = data.get("data", [])
          print("Trending API tracks:", len(tracks))
          assert isinstance(tracks, list) and tracks, "No tracks returned from Audius API"
          streamable = [t for t in tracks if t.get("id") and t.get("is_streamable") is not False and t.get("is_stream_gated") is not True]
          assert streamable, "No public, streamable tracks in sample"
          track = streamable[0]
          print("Example:", track.get("title"), "by", (track.get("user") or {}).get("name"))
          url = base + "/tracks/" + track["id"] + "/stream?app_name=AWEN"
          req = urllib.request.Request(url, headers={**headers, "Range": "bytes=0-1"})
          with urllib.request.urlopen(req, timeout=25) as response:
              mime = response.headers.get("Content-Type")
              head = response.read(2)
              print("Stream HTTP:", response.status, "type:", mime, "first bytes received:", len(head))
          assert head, "Audio endpoint produced no audio"
          PY
