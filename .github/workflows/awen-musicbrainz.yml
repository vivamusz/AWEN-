name: AWEN — MusicBrainz genre enrichment
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/awen_musicbrainz.py"
      - ".github/workflows/awen-musicbrainz.yml"
  schedule:
    - cron: "8,38 * * * *"

permissions:
  contents: write

concurrency:
  group: awen-musicbrainz-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Compile and validate parser
        run: python3 -m py_compile scripts/awen_musicbrainz.py
      - name: Query official MusicBrainz genre metadata (no audio downloads)
        env:
          AWEN_MB_BATCH: "110"
          AWEN_MB_DELAY: "1.25"
        run: python3 scripts/awen_musicbrainz.py
      - name: Commit independent genre hints and progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awen-musicbrainz.json awen-musicbrainz-progress.json
          if git diff --cached --quiet; then
            echo "No enrichment changes"
            exit 0
          fi
          git commit -m "Update AWEN MusicBrainz artist genre hints"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          exit 1
