name: AWEN Audius matched stream availability
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-stream-health.yml"
permissions:
  contents: read
jobs:
  stream-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Probe a small byte range from matched streams (never download songs)
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          from pathlib import Path
          state=json.loads(Path("awen-audius-matches.json").read_text(encoding="utf-8"))
          data=list(state.get("matches",{}).items())[:25]
          success=0
          for catalog_id,track in data:
            url=track.get("stream_url","")
            if not url.startswith("https://api.audius.co/v1/tracks/"):
              continue
            req=urllib.request.Request(url,headers={
              "User-Agent":"AWEN Music 1.0","Range":"bytes=0-3"
            })
            try:
              with urllib.request.urlopen(req,timeout=18) as resp:
                sample=resp.read(4)
                ctype=resp.headers.get("Content-Type","")
                ok=resp.status in (200,206) and len(sample)>0 and ("audio" in ctype or "mpeg" in ctype)
                print(catalog_id,track.get("title"),"HTTP",resp.status,ctype,"OK" if ok else "UNEXPECTED")
                success+=int(ok)
            except (urllib.error.URLError,TimeoutError) as exc:
              print(catalog_id,track.get("title"),"ERROR",str(exc))
          print("Stream samples accessible:",success,"of",len(data))
          assert success>0, "No matched streams accessible"
          PY
