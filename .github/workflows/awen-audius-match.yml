name: AWEN Audius catalog matching
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/awen_audius_match.py"
      - ".github/workflows/awen-audius-match.yml"
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write

concurrency:
  group: awen-audius-matcher
  cancel-in-progress: false

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout current catalog
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Search Audius with strict artist and title matching
        env:
          AWEN_AUDIUS_BATCH: "120"
          AWEN_AUDIUS_DELAY: "1.3"
        run: python3 scripts/awen_audius_match.py
      - name: Save independent Audius match map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add awen-audius-matches.json
          if git diff --cached --quiet; then
            echo "Audius match state unchanged"
            exit 0
          fi
          git commit -m "Update separate AWEN Audius exact matches"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Repo updated concurrently: rebasing (attempt $attempt)"
            git fetch origin main
            git rebase origin/main || exit 1
            sleep 2
          done
          exit 1
