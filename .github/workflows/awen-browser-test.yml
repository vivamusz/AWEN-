name: AWEN browser end-to-end smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "curator.html"
      - "awen-services.js"
      - "awen-open-music.js"
      - "scripts/awen_browser_smoke.py"
      - ".github/workflows/awen-browser-test.yml"
permissions:
  contents: read
concurrency:
  group: awen-browser-tests
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium test runner
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Serve project and test main pages
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/awen-http.log 2>&1 &
          sleep 2
          python3 scripts/awen_browser_smoke.py
      - name: Save screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: awen-smoke-failure-screenshots
          path: awen-test-artifacts/
          if-no-files-found: ignore
