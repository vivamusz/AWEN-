name: AWEN Openverse media API check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-openverse-check.yml"
permissions:
  contents: read
jobs:
  openverse-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check one browser-equivalent API request and audio host
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          api="https://api.openverse.org/v1/audio/"
          params={"q":"ambient","category":"music","page_size":"20","license_type":"commercial"}
          req=urllib.request.Request(api+"?"+urllib.parse.urlencode(params),headers={
              "User-Agent":"Mozilla/5.0 AWEN/1.0","Origin":"https://vivamusz.github.io","Accept":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  obj=json.load(resp)
                  candidates=[x for x in obj.get("results",[]) if x.get("category")=="music"
                    and x.get("license") in ("by","by-sa","cc0","pdm")
                    and int(x.get("duration") or 0)>60000 and x.get("url")]
                  print("OPENVERSE API:",resp.status,"CORS:",resp.headers.get("Access-Control-Allow-Origin"),
                        "licensed_candidates:",len(candidates))
          except urllib.error.HTTPError as err:
              print("OPENVERSE API error:",err.code,"body:",err.read(1000).decode("utf8","replace"))
          direct="https://prod-1.storage.jamendo.com/?trackid=20237&format=mp32"
          req=urllib.request.Request(direct,headers={
              "User-Agent":"Mozilla/5.0", "Origin":"https://vivamusz.github.io",
              "Range":"bytes=0-15"
          })
          try:
              with urllib.request.urlopen(req,timeout=25) as resp:
                  sample=resp.read(16)
                  print("PUBLISHER AUDIO:",resp.status,
                        "Content-Type:",resp.headers.get("Content-Type"),
                        "bytes:",len(sample))
          except urllib.error.HTTPError as err:
              print("PUBLISHER AUDIO error:",err.code,"body:",err.read(500).decode("utf8","replace"))
          PY
