name: AWEN Openverse media API check
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/awen-openverse-check.yml"
permissions:
  contents: read
jobs:
  openverse-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Openverse audio metadata and CORS
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse
          base="https://api.openverse.org/v1/audio/"
          for params in [
            {"q":"ambient","page_size":"5"},
            {"q":"ambient","page_size":"5","excluded_source":"jamendo"},
            {"q":"ambient","page_size":"5","license_type":"commercial"},
            {"q":"music","page_size":"5"},
          ]:
            url=base+"?"+urllib.parse.urlencode(params)
            req=urllib.request.Request(url,headers={
              "User-Agent":"AWEN Music 1.0 (license search)",
              "Origin":"https://vivamusz.github.io",
              "Accept":"application/json",
            })
            with urllib.request.urlopen(req,timeout=25) as resp:
              obj=json.load(resp)
              print("Params",params,"HTTP",resp.status,"CORS",resp.headers.get("Access-Control-Allow-Origin"),"results",obj.get("result_count"))
            for item in obj.get("results",[])[:2]:
              print("ITEM",json.dumps({k:item.get(k) for k in (
                "id","title","creator","license","license_url","url",
                "foreign_landing_url","source","category","filetype","duration"
              )},ensure_ascii=False))

          print("Checking an actual licensed music stream (small byte range)...")
          params={"q":"ambient","category":"music","page_size":"60","license_type":"commercial"}
          req=urllib.request.Request(base+"?"+urllib.parse.urlencode(params),headers={
            "User-Agent":"AWEN Music 1.0","Origin":"https://vivamusz.github.io","Accept":"application/json"
          })
          with urllib.request.urlopen(req,timeout=25) as resp: data=json.load(resp)
          licensed=[x for x in data.get("results",[]) if x.get("category")=="music" and
             x.get("license") in ("by","by-sa","cc0","pdm") and
             int(x.get("duration") or 0)>60000 and x.get("url")]
          print("Licensed full-length candidates in sample:",len(licensed))
          if licensed:
            item=licensed[0]
            req=urllib.request.Request(item["url"],headers={
              "User-Agent":"AWEN Music 1.0","Range":"bytes=0-3"
            })
            try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                tiny=resp.read(4)
                print("Audio URL:",item["url"],"HTTP:",resp.status,
                      "Content-Type:",resp.headers.get("Content-Type"),"sample_bytes:",len(tiny))
            except Exception as exc:
              print("Publisher audio may block remote playback:",repr(exc))

          PY
