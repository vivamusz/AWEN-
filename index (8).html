'use strict';
const $ = (s) => document.querySelector(s);
const ico = (n,c='i') => `<svg class="${c}" aria-hidden="true"><use href="#ic-${n}"/></svg>`;
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

const normalize = s=>String(s??'').normalize('NFKC').toLocaleLowerCase().replace(/ё/g,'е');
const palettes = [['#30286a','#bf4d9d'],['#223d65','#26a3c1'],['#662d4d','#eb7652'],['#264c50','#8c8cbd'],['#65384a','#a74b82'],['#3c396c','#7062d4'],['#4c3268','#ed66a1'],['#20526b','#5182c0'],['#59407e','#e075ab'],['#39675e','#63b294'],['#59456c','#c38763'],['#763b51','#d15e70']];

  ['Bass Music / EDM','Future Bass','Melodic Bass','Dubstep','Melodic Dubstep','Brostep','Riddim','EDM Trap','Electro House','Big Room','Midtempo Bass'],

const playlists=[
  {id:'road',name:'Спокойная дорога',desc:'Спокойные песни на русском, казахском и английском. Лёгкий электронный звук, мелодичный вокал и музыка для долгих поездок.',color:['#26677d','#5862c3'],tags:['Спокойное','Дорожное','Мелодичное']},
  {id:'night',name:'Ночной вайб',desc:'Спокойный и атмосферный Phonk. Мягкие басы, размеренный ритм и ночное настроение.',color:['#1d365e','#8b4dc2'],tags:['Chill Phonk','Атмосферное','Ночное']},

  {id:'dance',name:'Танцуем',desc:'House, EDM, Moombahton, Brazilian Funk, Disco и другие танцевальные стили.',color:['#7b327d','#e77b51'],tags:['Танцевальное','House','Moombahton']},
  {id:'chill',name:'Чилл',desc:'Lo-Fi, Chillout, Downtempo, Ambient, Lounge и инструментальные биты для отдыха.',color:['#225d60','#9a7ea3'],tags:['Lo-Fi','Chillout','Расслабленное']}
];
const words=['Тихий город','После дождя','Вечерний свет','Без лишних слов','На горизонте','Параллельные миры','Старые кассеты','Далёкий берег','Новая глава','Над облаками','Тёплый ветер','Вне времени','Фиолетовый закат','Зимний маршрут','Ночное радио','Городские огни','Мягкий ритм','Медленный рассвет','Вторая сторона','Пульс улиц','Последний автобус','Дорога домой','Сигналы издалека','Море внутри','Тонкая грань','Письмо из прошлого','Танцы до утра','Линии света','Другая планета','Забытый мотив'];
const artistsSeed=['AWEN Demo','Neon Atlas (демо)','Quiet Horizon (демо)','Studio Test (демо)','Night Archive (демо)','Wave Station (демо)','Demo Collective'];
const languages=['Русский','Қазақша','English','Без слов'];
function demoTracks(){
  const arr=[];
  for(let i=0;i<54;i++){
    const g=genreData[i%genreData.length], st=g.styles[(Math.floor(i/genreData.length)+i)%g.styles.length];
    const mood=(i%6===0?'Ночное':i%5===0?'Агрессивное':i%4===0?'Танцевальное':i%3===0?'Расслабленное':'Спокойное');
    arr.push({id:'demo-'+i,title:words[i%words.length]+(i>=words.length?' · '+(Math.floor(i/words.length)+1):''),artist:artistsSeed[i%artistsSeed.length],album:i%4===0?'Demo Sessions':'Без альбома',genre:g.name,subgenres:[st],year:2010+(i%17),language:languages[i%4],moods:[mood],energy:1+(i%5),bpm:70+(i*7)%105,duration:125+(i*17)%195,source_status:i%8===0?'unavailable':'unknown',source_url:'',audio_url:'',playlists:[],added_at:`2026-10-${String(1+i%29).padStart(2,'0')}`});
  }
  // This is an ORIGINAL, synthesized test sound generated in the browser, not a VK song.
  arr.unshift({id:'awen-soundcheck',title:'Тест плеера · оригинальный демо-звук',artist:'AWEN Studio (тест)',album:'Проверка интерфейса',genre:'Chill / Lo-Fi / Ambient',subgenres:['Ambient'],year:2026,language:'Без слов',moods:['Расслабленное'],energy:1,bpm:76,duration:9,source_status:'available',audio_url:'demo://soundcheck',source_url:'',playlists:['chill'],added_at:'2026-11-19'});
  // Make the demonstration playlists visibly populated.
  arr.forEach((t,i)=>{ if(i>0) t.playlists=[playlists[i%5].id]; });
  return arr;
}
const sampleTracks=[
 {id:'awen-example-001',title:'Пример трека',artist:'Исполнитель',album:'Без альбома',genre:'Phonk',subgenres:['Chill Phonk'],year:2024,language:'Без слов',moods:['Ночное','Спокойное'],energy:2,bpm:110,duration:186,source_status:'unknown',source_url:'https://vk.com/awenqc',audio_url:'',playlists:['night'],added_at:'2026-11-19'},
 {id:'awen-example-002',title:'Пример кантри',artist:'Исполнитель 2',album:'Тестовый альбом',genre:'Country',subgenres:['Country Rock'],year:2020,language:'English',moods:['Дорожное'],energy:3,bpm:95,duration:210,source_status:'unknown',source_url:'',audio_url:'',playlists:['road']}
];
let tracks=demoTracks(), dataMode='demo';
const state={view:'home',genre:'',subgenre:'',artist:'',album:'',year:'',language:'',mood:'',status:'',sort:'new',q:'',playlist:'',genreDetail:'',visible:60};
let favorites=new Set(); try { favorites=new Set(JSON.parse(localStorage.getItem('awen_favs')||'[]')); } catch {}
const audio=$('#audio'); audio.volume=.8;
let current=null, queue=[], queuePos=-1, shuffle=false, repeat=false, soundcheckUrl=null, toastTimer=null, searchTimer=null;
function saveFav(){try{localStorage.setItem('awen_favs',JSON.stringify([...favorites]));}catch{}}
const byId=id=>tracks.find(t=>t.id===id);
function isPlayable(t){return Boolean(t && (t.audio_url==='demo://soundcheck'||safeAudio(t.audio_url)));}
function safeAudio(url){ if(!url) return ''; try { const u=new URL(url,location.href); if(u.protocol!=='https:' && !(u.protocol==='http:' && u.origin===location.origin))return ''; return u.href; }catch{return '';} }
function safeSource(url){ if(!url)return ''; try{const u=new URL(url);return ['https:','http:'].includes(u.protocol)?u.href:'';}catch{return '';} }
function colorFor(x){let h=0;for(let i=0;i<String(x).length;i++)h=(h*31+String(x).charCodeAt(i))>>>0;return palettes[h%palettes.length];}
function cover(label,palette,cls=''){const c=palette||colorFor(label);return `<div class="cover ${cls}" style="--a:${c[0]};--b:${c[1]}">${ico('music','i cover-icon')}</div>`;}
function num(n){return Number(n||0).toLocaleString('ru-RU');}
function dur(v){const n=Math.max(0,Math.floor(Number(v)||0));return `${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;}
function countWhere(fn){return tracks.filter(fn).length;}
function demoBanner(){ return dataMode==='demo'?`<div class="data-banner">${ico('info')}<div><strong>Демонстрация интерфейса.</strong> Все названия и исполнители здесь вымышленные. Это <strong>не песни из ВК</strong>. Для проверки плеера доступен один оригинальный синтезированный фрагмент. Реальный каталог можно подключить через JSON.</div></div>`:`<div class="data-banner">${ico('info')}<div><strong>Каталог: ${dataMode==='file'?'локальный импорт':'tracks.json'}.</strong> ${dataMode==='file'?'Импорт доступен только в этом браузере; чтобы его видели все посетители, нужно разместить tracks.json в репозитории.':'Данные загружены из файла репозитория.'} Воспроизводятся только треки с разрешённым прямым аудио-адресом.</div></div>`; }
function pageHead(title,desc,right=''){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${right}</div>`;}
function section(title,desc,html,link){return `<div class="sec-head"><div><h2>${esc(title)}</h2>${desc?`<p>${esc(desc)}</p>`:''}</div>${link?`<button class="text-action" ${link}>Показать всё ${ico('right','i sm')}</button>`:''}</div>${html}`;}
function tile(t){return `<article class="tile" data-track-details="${esc(t.id)}" title="Информация о треке">${cover(t.title,colorFor(t.genre))}<div class="tile-title">${esc(t.title)}</div><div class="tile-meta">${esc(t.artist)}</div></article>`;}

function home(){const artists=uniqueBy('artist').slice(0,7);const recent=[...tracks].sort((a,b)=>String(b.added_at||'').localeCompare(String(a.added_at||''))).slice(0,9);return `${demoBanner()}<section class="hero"><div class="hero-copy"><span class="kicker">♫ &nbsp; ТВОЯ МУЗЫКАЛЬНАЯ КОЛЛЕКЦИЯ</span><h1>Звук, который<br>остаётся с тобой.</h1><p>Музыка AWEN — от спокойного Lo-Fi до мощного Phonk. Жанры, исполнители и любимые подборки в одном месте.</p><div class="hero-actions"><button class="btn primary" data-nav="tracks">${ico('music')} Открыть каталог</button><button class="btn ghost" data-nav="playlists">${ico('list')} Подборки</button></div></div><div class="hero-art" aria-hidden="true"><div class="disc"></div></div></section>
 <div class="stats"><div class="stat">${ico('music')}<b>${num(tracks.length)}</b> треков в каталоге</div><div class="stat">${ico('users')}<b>${num(uniqueBy('artist').length)}</b> исполнителей</div><div class="stat">${ico('grid')}<b>${genreData.length}</b> направлений</div><div class="stat">${ico('list')}<b>${playlists.length}</b> подборок</div></div>
 ${section('Твои подборки','Музыка под настроение и момент',`<div class="rail">${playlists.map(playlistTile).join('')}</div>`,'data-nav="playlists"')}
 ${section('Недавно добавленные','Последние записи музыкального каталога',`<div class="rail">${recent.map(tile).join('')}</div>`,'data-nav="tracks"')}
 ${section('Исследуй жанры','От кантри до Future Bass и Phonk',`<div class="genre-grid">${genreData.slice(0,8).map(genreCard).join('')}</div>`,'data-nav="genres"')}
 ${section('Исполнители','Открой музыку по автору',`<div class="rail">${artists.map(a=>`<article class="tile" data-artist="${esc(a)}">${cover(a)}<div class="tile-title">${esc(a)}</div><div class="tile-meta">${num(countWhere(t=>t.artist===a))} композиций</div></article>`).join('')}</div>`,'data-nav="artists"')}`;}

function aboutView(){return `${demoBanner()}${pageHead('О проекте','Музыкальный каталог AWEN')}<div class="about"><div class="about-card"><h2>AWEN Music</h2><p>Независимый музыкальный каталог сообщества <a href="https://vk.ru/awenqc" target="_blank" rel="noopener noreferrer">AWEN ВКонтакте ↗</a>. Первая версия — статический сайт для GitHub Pages, сделанный в атмосфере классических музыкальных сервисов конца 2010-х.</p><p><b>Что работает:</b> страницы, поиск, 19 направлений, подробные стили, фильтры, пять подборок, локальное избранное, загрузка JSON, плеер для прямых разрешённых аудиоисточников и тестовый синтезированный звук.</p><p><b>Чего пока нет:</b> подключения к VK API, автоматического скачивания музыки, сервера, общей облачной библиотеки и авторизации пользователей.</p></div><div class="about-card"><h2>Как добавить настоящие треки</h2><ul><li>Скачай образец JSON в верхней панели.</li><li>Добавь свои записи в массив <code>tracks</code>.</li><li>Проверь импорт кнопкой «Импорт JSON». Импорт сохраняется в браузере этого устройства.</li><li>Чтобы каталог был одинаковым для всех, добавь файл <b>tracks.json</b> рядом с <b>index.html</b> в репозитории. При открытии сайт загрузит этот JSON автоматически.</li></ul><p>Аудиоплеер принимает только прямые ссылки <code>audio_url</code> на файлы, которые ты вправе размещать или воспроизводить. Ссылки на публикации VK хранятся отдельно как <code>source_url</code>; они не заменяют аудиофайл.</p></div><div class="about-card"><button class="btn" data-action="sample">${ico('download')} Скачать пример JSON</button> <button class="btn" data-action="export">${ico('download')} Экспорт текущего каталога</button> <button class="btn" data-action="reset">Показать демо-каталог</button></div></div>`;}

function makeSoundcheck(){if(soundcheckUrl)return soundcheckUrl;const hz=11025, seconds=9, len=hz*seconds, bytes=new ArrayBuffer(44+len*2),view=new DataView(bytes);let at=0;function str(s){for(let c of s)view.setUint8(at++,c.charCodeAt(0));}function u32(v){view.setUint32(at,v,true);at+=4;}function u16(v){view.setUint16(at,v,true);at+=2;}str('RIFF');u32(36+len*2);str('WAVEfmt ');u32(16);u16(1);u16(1);u32(hz);u32(hz*2);u16(2);u16(16);str('data');u32(len*2);
 const notes=[220,261.63,329.63,392,293.66,349.23,440,329.63,246.94];for(let i=0;i<len;i++){const t=i/hz,ni=Math.floor(t)%notes.length,phase=t-Math.floor(t),freq=notes[ni],env=Math.min(1,t/.2)*Math.min(1,(seconds-t)/.65);let sample=(Math.sin(2*Math.PI*freq*t)*.14+Math.sin(2*Math.PI*(freq/2)*t)*.13+Math.sin(2*Math.PI*(freq*1.5)*t)*.045)*env*(.77+.23*Math.cos(phase*2*Math.PI));view.setInt16(at,Math.max(-32768,Math.min(32767,sample*32767)),true);at+=2;}
 soundcheckUrl=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));return soundcheckUrl;}

 const url=t.audio_url==='demo://soundcheck'?makeSoundcheck():safeAudio(t.audio_url);if(!url)return;
 const mustChange=!current||current.id!==t.id;current=t;if(mustChange){audio.src=url;audio.load();} queue=filtered().filter(isPlayable).map(x=>x.id);if(!queue.includes(t.id))queue.unshift(t.id);queuePos=queue.indexOf(t.id);updatePlayer();audio.play().catch(()=>flash('Не удалось запустить аудио. Проверь доступность файла и разрешение браузера.'));closeModal();}

function cleanTrack(x,i){if(!x||typeof x!=='object'||Array.isArray(x))return null;const s=(v,max=250)=>String(v??'').trim().slice(0,max);const raw=s(x.genre,100);const gn=genreData.find(g=>normalize(g.name)===normalize(raw));return {id:s(x.id||`import-${i}`,100),title:s(x.title||'Без названия'),artist:s(x.artist||'Неизвестный исполнитель'),album:s(x.album||'Без альбома'),genre:gn?gn.name:raw,subgenres:Array.isArray(x.subgenres)?x.subgenres.slice(0,12).map(y=>s(y,100)):[],year:Number(x.year)||null,language:s(x.language),moods:Array.isArray(x.moods)?x.moods.slice(0,12).map(y=>s(y,80)):[],energy:Math.max(1,Math.min(5,Number(x.energy)||3)),bpm:Number(x.bpm)||null,duration:Math.max(0,Number(x.duration)||0),source_status:['available','unavailable','unknown'].includes(x.source_status)?x.source_status:'unknown',source_url:s(x.source_url,1500),audio_url:s(x.audio_url,1500),playlists:Array.isArray(x.playlists)?x.playlists.filter(y=>playlists.some(p=>p.id===y)):[],added_at:s(x.added_at,30)};}
function parseData(obj){const a=Array.isArray(obj)?obj:obj&&Array.isArray(obj.tracks)?obj.tracks:null;if(!a)throw Error('Нужен массив треков или объект {"tracks": [...]}');if(a.length>30000)throw Error('Лимит демоверсии — 30 000 записей.');const seen=new Set();return a.map(cleanTrack).filter(t=>{if(!t||seen.has(t.id))return false;seen.add(t.id);return true;});}
function openDB(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return reject(Error('Нет IndexedDB'));const req=indexedDB.open('awen-music-db',1);req.onupgradeneeded=()=>req.result.createObjectStore('library');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}
async function dbSet(k,v){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('library','readwrite');tx.objectStore('library').put(v,k);tx.oncomplete=()=>{db.close();res();};tx.onerror=()=>rej(tx.error);});}
async function dbGet(k){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('library');const r=tx.objectStore('library').get(k);r.onsuccess=()=>{db.close();res(r.result);};r.onerror=()=>rej(r.error);});}
async function importFile(file){if(!file)return;if(file.size>40*1024*1024){flash('JSON больше 40 МБ. Для больших библиотек лучше загрузить tracks.json в GitHub.');return;}try{const json=JSON.parse(await file.text()),clean=parseData(json);tracks=clean;dataMode='file';resetFilters();navigate('tracks');flash(`Импортировано ${num(clean.length)} записей. Сохраняем в браузере...`);try{await dbSet('tracks',clean);await dbSet('mode','file');flash(`Сохранено ${num(clean.length)} записей в этом браузере.`);}catch{flash('Импорт выполнен, но не удалось сохранить его для следующего открытия.');}}catch(e){flash('Ошибка JSON: '+e.message);}}
async function loadCatalog(){try{const response=await fetch('./tracks.json',{cache:'no-store'});if(response.ok){const parsed=parseData(await response.json());tracks=parsed;dataMode='remote';render();return;}}catch{}try{const saved=await dbGet('tracks');if(Array.isArray(saved)){tracks=saved;dataMode='file';render();}}catch{} }
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-track-details],[data-playlist],[data-artist],[data-album],[data-genre],[data-subgenre]');if(!b)return;const d=b.dataset;
 if(d.nav){navigate(d.nav);return;}
 if(d.action==='import'){$('#jsonFile').click();return;}
 if(d.action==='sample'){download('awen-tracks-example.json',JSON.stringify({tracks:sampleTracks},null,2));flash('Образец JSON скачан');return;}
 if(d.action==='export'){download('awen-music-export.json',JSON.stringify({tracks},null,2));return;}
 if(d.action==='reset'){tracks=demoTracks();dataMode='demo';dbSet('tracks',null).catch(()=>{});navigate('home');flash('Демо-каталог восстановлен');return;}
 if(d.action==='clear'){resetFilters();render();return;}
 if(d.action==='more'){state.visible+=60;render();return;}
 if(d.action==='close-genre'){state.genreDetail='';render();return;}
 if(d.action==='close-modal'){closeModal();return;}
 if(d.fav){if(favorites.has(d.fav))favorites.delete(d.fav);else favorites.add(d.fav);saveFav();updatePlayer();if($('#modalBackdrop').classList.contains('show'))details(d.fav);render();return;}
 if(d.trackPlay){const t=byId(d.trackPlay);if(t)playTrack(t);return;}
 if(d.trackDetails){details(d.trackDetails);return;}
 if(d.playlist){state.playlist=d.playlist;state.view='playlist-detail';resetFilters();render();window.scrollTo(0,0);return;}
 if(d.artist){navigate('tracks');state.artist=d.artist;render();return;}
 if(d.album){navigate('tracks');state.album=d.album;render();return;}
 if(d.subgenre){navigate('tracks');state.genre=d.parent||'';state.subgenre=d.subgenre;render();return;}
 if(d.genre){if(d.openTracks){navigate('tracks');state.genre=d.genre;render();}else{navigate('genres');state.genreDetail=d.genre;render();}return;}
});
document.addEventListener('change',e=>{const f=e.target.dataset.filter;if(f){state[f]=e.target.value;state.visible=60;if(f==='genre')state.subgenre='';render();}});
$('#globalSearch').addEventListener('input',e=>{clearTimeout(searchTimer);const val=e.target.value;searchTimer=setTimeout(()=>{state.q=val;state.visible=60;if(val && !['tracks','artists','albums','genres'].includes(state.view))state.view='tracks';render();},170);});
$('#jsonFile').addEventListener('change',e=>{importFile(e.target.files[0]);e.target.value='';});
$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#playBtn').addEventListener('click',()=>{if(!current)return;if(audio.paused)audio.play().catch(()=>flash('Не удалось воспроизвести файл'));else audio.pause();});
$('#prevBtn').addEventListener('click',()=>nextTrack(-1));$('#nextBtn').addEventListener('click',()=>nextTrack(1));
$('#shuffleBtn').addEventListener('click',()=>{shuffle=!shuffle;$('#shuffleBtn').style.color=shuffle?'#ca8fff':'';});
$('#repeatBtn').addEventListener('click',()=>{repeat=!repeat;$('#repeatBtn').style.color=repeat?'#ca8fff':'';});
$('#playerFavorite').addEventListener('click',()=>{if(!current)return;if(favorites.has(current.id))favorites.delete(current.id);else favorites.add(current.id);saveFav();updatePlayer();render();});
$('#volume').addEventListener('input',e=>{audio.volume=Number(e.target.value);});
$('#seek').addEventListener('input',e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100;});
audio.addEventListener('timeupdate',()=>{$('#curTime').textContent=dur(audio.currentTime);$('#totalTime').textContent=dur(audio.duration);if(Number.isFinite(audio.duration)&&audio.duration>0)$('#seek').value=(audio.currentTime/audio.duration*100).toFixed(1);});
audio.addEventListener('play',updatePlayer);audio.addEventListener('pause',updatePlayer);audio.addEventListener('loadedmetadata',updatePlayer);
audio.addEventListener('ended',()=>{if(repeat){audio.currentTime=0;audio.play().catch(()=>{});}else if(queue.length>1)nextTrack(1);else updatePlayer();});
audio.addEventListener('error',()=>{if(current)flash('Аудио не загрузилось. Проверь прямой адрес файла и его доступность.');});
render();loadCatalog();
</script>
</body>
</html>
